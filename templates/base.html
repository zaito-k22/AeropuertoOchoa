<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RápidoOchoa - Sistema de Gestión de Aerolínea{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
            <div id="flash-messages" style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
                {% for category, message in messages %}
                    <div class="flash-message flash-{{ category }}" style="padding: 15px 20px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
            <script>
                // Ocultar mensajes flash después de 5 segundos
                setTimeout(function() {
                    var flashMessages = document.getElementById('flash-messages');
                    if (flashMessages) {
                        flashMessages.style.opacity = '0';
                        flashMessages.style.transition = 'opacity 0.5s';
                        setTimeout(function() {
                            flashMessages.remove();
                        }, 500);
                    }
                }, 5000);
            </script>
        {% endif %}
    {% endwith %}
    
    {% block content %}{% endblock %}
</body>
</html>
