{% extends "base.html" %}

{% block content %}
<div class="section active">
    <div class="container">
        <header class="section-header">
            <a href="{{ url_for('empleado.menu') }}" class="back-btn" style="text-decoration: none; display: inline-block;">← Volver al Menú</a>
            <h2>👥 Gestión de Empleados</h2>
        </header>
        <div class="employees-actions">
            <button class="btn-primary" onclick="document.getElementById('formulario-empleado').style.display='block'">+ Nuevo Empleado</button>
        </div>
        
        <div id="formulario-empleado" style="display: none; background: #f8f9fa; padding: 25px; border-radius: 12px; margin-bottom: 25px;">
            <h3 style="margin-bottom: 20px; color: #667eea;">Registrar Nuevo Empleado</h3>
            <form method="POST" action="{{ url_for('empleado.gestion_empleados') }}" style="display: grid; gap: 15px;">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" name="nombre" required>
                </div>
                <div class="form-group">
                    <label>Cargo</label>
                    <select name="cargo" required>
                        <option value="">Seleccione cargo</option>
                        <option value="Piloto">Piloto</option>
                        <option value="Tripulación">Tripulación</option>
                        <option value="Recepcionista">Recepcionista</option>
                        <option value="Administrador">Administrador</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn-primary">Registrar</button>
                    <button type="button" class="btn-secondary" onclick="document.getElementById('formulario-empleado').style.display='none'">Cancelar</button>
                </div>
            </form>
        </div>
        
        <div class="employees-list">
            {% for empleado in empleados %}
            <div class="employee-card">
                <div class="employee-avatar">{{ empleado.avatar }}</div>
                <div class="employee-info">
                    <h3>{{ empleado.nombre }}</h3>
                    <p>{{ empleado.cargo }}</p>
                    <p>ID: {{ empleado.id }}</p>
                    <p>📧 {{ empleado.email }}</p>
                </div>
                <div class="employee-actions">
                    <button class="btn-secondary">Ver Perfil</button>
                    <button class="btn-secondary">Editar</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
